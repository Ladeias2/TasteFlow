# Sobe o banco (com os scripts de database/ e os dados simulados) e a API.
#   docker compose up --build
#   API:  http://localhost:8000/docs
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurante
      MYSQL_USER: tasteflow
      MYSQL_PASSWORD: tasteflow123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      # executados em ordem alfabética na primeira inicialização
      - ./database:/docker-entrypoint-initdb.d:ro
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: tasteflow
      DB_PASSWORD: tasteflow123
      DB_NAME: restaurante
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fotos:/app/storage

volumes:
  dados_mysql:
  fotos:
